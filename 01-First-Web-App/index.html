<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Personal Task Tracker</h1>
    <p class="app-tagline">Stay organized. Get things done.</p>
  </header>

  <main class="app-main">
    <!-- Task Entry Form -->
    <section class="task-form-section" aria-labelledby="form-title">
      <h2 id="form-title" class="visually-hidden">Add New Task</h2>
      <form id="task-form" class="task-form" novalidate>
        <div class="form-group">
          <label for="task-title">Task Title <span class="required" aria-hidden="true">*</span></label>
          <input
            type="text"
            id="task-title"
            name="title"
            placeholder="What needs to be done?"
            required
            maxlength="200"
            autocomplete="off"
          >
          <span id="title-error" class="error-message" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="task-due-date">Due Date (optional)</label>
          <input
            type="date"
            id="task-due-date"
            name="dueDate"
          >
        </div>

        <button type="submit" id="add-task-btn" class="btn btn-primary">
          Add Task
        </button>
      </form>
    </section>

    <!-- Filter Controls -->
    <section class="filter-section" aria-labelledby="filter-title">
      <h2 id="filter-title" class="visually-hidden">Filter Tasks</h2>
      <div class="filter-tabs" role="tablist" aria-label="Task filters">
        <button
          role="tab"
          id="filter-all"
          class="filter-tab active"
          aria-selected="true"
          aria-controls="task-list"
          data-filter="all"
        >
          All
        </button>
        <button
          role="tab"
          id="filter-pending"
          class="filter-tab"
          aria-selected="false"
          aria-controls="task-list"
          data-filter="pending"
        >
          Pending
        </button>
        <button
          role="tab"
          id="filter-completed"
          class="filter-tab"
          aria-selected="false"
          aria-controls="task-list"
          data-filter="completed"
        >
          Completed
        </button>
      </div>
      <span id="task-count" class="task-count" aria-live="polite"></span>
    </section>

    <!-- Task List -->
    <section class="task-list-section" aria-labelledby="list-title">
      <h2 id="list-title" class="visually-hidden">Tasks</h2>

      <!-- Empty State (shown when no tasks match filter) -->
      <div id="empty-state" class="empty-state hidden" aria-live="polite">
        <p id="empty-message"></p>
      </div>

      <!-- Task List (populated by JavaScript) -->
      <ul id="task-list" class="task-list" role="list"></ul>
    </section>

    <!-- localStorage Error Message -->
    <div id="storage-error" class="storage-error hidden" aria-live="assertive"></div>
  </main>

  <footer class="app-footer">
    <p>Built as part of AI-Product-Lab — <a href="../README.md">Project 1</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
